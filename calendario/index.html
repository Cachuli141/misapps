<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizador de Calendario</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5B5FEF">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F1F4;
  --surface:#FFFFFF;
  --surface-2:#E7E8EE;
  --border:#DCDEE6;
  --ink:#20222B;
  --ink-muted:#6B6E7A;
  --accent:#5B5FEF;
  --accent-ink:#FFFFFF;
  --accent-soft:#E9E9FC;
  --today:#7FCCEF;
  --danger:#E2665A;
  --star:#F0B429;
  --shadow: 0 12px 30px rgba(30,32,45,.14);
  --radius-cell:7px;
  --radius-card:16px;
  --radius-pill:999px;
}
html[data-theme="dark"]{
  --bg:#14151B;
  --surface:#1D1F27;
  --surface-2:#262933;
  --border:#343743;
  --ink:#ECEDF2;
  --ink-muted:#9A9EAD;
  --accent:#7B7FFF;
  --accent-ink:#12131A;
  --accent-soft:#2B2C4A;
  --today:#5AB8E6;
  --danger:#EA7B70;
  --star:#F2C158;
  --shadow: 0 12px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  height:100vh;
  overflow:hidden;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,.display,.daynum,button,.pill,.segbtn{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
.app{display:flex;flex-direction:column;height:100vh;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:14px 22px;border-bottom:1px solid var(--border);
  background:var(--surface);
}
.wordmark{font-size:19px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
.wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
.view-dropdown{position:relative;}
.view-btn{
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink);
  border-radius:var(--radius-pill);padding:7px 14px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:6px;
}
.view-menu{
  position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  min-width:150px;overflow:hidden;z-index:40;display:none;
}
.view-menu.open{display:block;}
.view-menu button{
  display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:none;
  color:var(--ink);font-size:13.5px;font-weight:500;
}
.view-menu button:hover{background:var(--surface-2);}
.view-menu button.active{color:var(--accent);}
.spacer{flex:1;}
.searchwrap{position:relative;width:220px;}
.searchwrap input{
  width:100%;padding:8px 12px 8px 32px;border-radius:var(--radius-pill);
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:13px;
}
.searchwrap input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.searchwrap .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55;font-size:13px;}
.search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);
  max-height:220px;overflow:auto;z-index:40;display:none;
}
.search-results.open{display:block;}
.search-results div{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);}
.search-results div:last-child{border-bottom:none;}
.search-results div:hover{background:var(--surface-2);}
.search-results .sr-title{font-weight:600;}
.search-results .sr-date{color:var(--ink-muted);font-size:11.5px;}
.iconbtn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:15px;
}
.iconbtn:hover{background:var(--accent-soft);}

/* ---------- Main layout ---------- */
.main{flex:1;display:flex;overflow:hidden;}
.cal-area{flex:1;display:flex;flex-direction:column;padding:18px 20px 20px;overflow:auto;}
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.cal-nav .navbtn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.cal-nav .navbtn:hover{background:var(--accent-soft);border-color:var(--accent);}
.cal-title{font-size:20px;font-weight:600;min-width:180px;}
.today-btn{
  margin-left:auto;background:var(--accent);color:var(--accent-ink);border:none;
  border-radius:var(--radius-pill);padding:8px 16px;font-size:13px;font-weight:600;
}
.today-btn:hover{opacity:.88;}

.cal-body{flex:1;}
.fade{animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* Year view */
.year-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.mini-month{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:12px;}
.mini-month h3{margin:0 0 8px;font-size:13.5px;font-weight:600;text-align:center;}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mini-grid .wd{font-size:9px;color:var(--ink-muted);text-align:center;font-weight:600;}
.mini-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:5px;font-size:10.5px;position:relative;cursor:pointer;user-select:none;
}
.mini-cell.pad{cursor:default;}
.mini-cell:not(.pad):hover{background:var(--surface-2);}
.mini-cell.today{box-shadow:inset 0 0 0 1.5px var(--today);font-weight:700;}
.mini-cell .dots{display:flex;flex-wrap:wrap;gap:1.5px;position:absolute;bottom:2px;width:15px;justify-content:center;}
.mini-cell .dots span{width:4px;height:4px;border-radius:50%;display:block;flex:0 0 auto;}
.mini-cell.drag-range{background:var(--accent-soft);}

/* Three-month view */
.three-grid{display:flex;gap:20px;flex-wrap:wrap;}
.big-month{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;flex:1;min-width:280px;}
.big-month h3{margin:0 0 12px;font-size:16px;font-weight:600;}
.big-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.big-grid .wd{font-size:11px;color:var(--ink-muted);text-align:center;font-weight:600;padding-bottom:4px;}
.big-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:var(--radius-cell);font-size:13px;position:relative;cursor:pointer;user-select:none;gap:2px;
}
.big-cell.pad{cursor:default;}
.big-cell:not(.pad):hover{background:var(--surface-2);}
.big-cell.today{box-shadow:inset 0 0 0 2px var(--today);font-weight:700;}
.big-cell .dots{display:flex;flex-wrap:wrap;gap:2px;width:24px;justify-content:center;}
.big-cell .dots span{width:6.5px;height:6.5px;border-radius:50%;display:block;flex:0 0 auto;}
.big-cell.drag-range{background:var(--accent-soft);}
.daynum{font-family:'Space Grotesk',sans-serif;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:290px;border-left:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;overflow:auto;
}
.sb-section{padding:18px 18px 14px;border-bottom:1px solid var(--border);}
.sb-section h2{font-size:14px;font-weight:600;margin:0 0 12px;letter-spacing:.2px;}
.collection{margin-bottom:8px;border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.collection-head{
  display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;background:var(--surface-2);
}
.collection-head .swatch{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
.collection-head .cname{flex:1;font-size:13.5px;font-weight:600;}
.collection-head .chev{font-size:10px;opacity:.6;transition:transform .2s;}
.collection.open .chev{transform:rotate(90deg);}
.collection-head .del{opacity:.45;font-size:12px;border:none;background:none;color:var(--ink);}
.collection-head .del:hover{opacity:1;color:var(--danger);}
.collection-head .recur-toggle{opacity:.35;font-size:12px;border:none;background:none;filter:grayscale(1);}
.collection-head .recur-toggle:hover{opacity:.8;}
.collection-head .recur-toggle.active{opacity:1;filter:none;}
.collection-head .dots-toggle{opacity:.45;font-size:12px;border:none;background:none;}
.collection-head .dots-toggle:hover{opacity:1;}
.collection-head .dots-toggle.active{opacity:1;}
.collection-body{display:none;padding:8px 10px 10px;}
.collection.open .collection-body{display:block;}
.event-row{
  display:flex;align-items:center;gap:6px;padding:5px 4px;font-size:12.5px;border-radius:7px;
}
.event-row:hover{background:var(--surface-2);}
.event-row .edot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.event-row .etitle{flex:1;}
.event-row .edate{color:var(--ink-muted);font-size:11px;}
.event-row .estar{border:none;background:none;font-size:12.5px;opacity:.5;}
.event-row .estar.fav,.event-row .estar:hover{opacity:1;color:var(--star);}
.event-row .ehide{border:none;background:none;font-size:11.5px;opacity:.45;}
.event-row .ehide:hover,.event-row .ehide.active{opacity:1;}
.event-row .edel{border:none;background:none;font-size:11.5px;opacity:.35;color:var(--ink);}
.event-row .edel:hover{opacity:1;color:var(--danger);}
.month-sep{display:flex;align-items:center;gap:8px;margin:10px 0 5px;}
.month-sep .line{flex:1;height:1px;background:var(--border);}
.month-sep .mlabel{font-size:11px;color:var(--ink-muted);font-weight:600;white-space:nowrap;}
.addlink{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);
  border:none;background:none;font-weight:600;margin-top:4px;padding:2px 0;
}
.addlink:hover{text-decoration:underline;}
.newcol-btn{
  width:100%;border:1.5px dashed var(--border);background:none;border-radius:12px;
  padding:9px;font-size:13px;color:var(--ink-muted);font-weight:600;margin-top:4px;
}
.newcol-btn:hover{border-color:var(--accent);color:var(--accent);}
.empty-note{font-size:12.5px;color:var(--ink-muted);line-height:1.5;margin-bottom:8px;}
.fav-row{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12.5px;}
.fav-row .star{color:var(--star);font-size:12px;}
.fav-row .ftitle{flex:1;font-weight:500;}
.fav-row .fdays{color:var(--ink-muted);font-size:11px;font-weight:600;}
.export-btn{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-pill);
  padding:9px;font-size:12.5px;font-weight:600;color:var(--ink);
}
.export-btn:hover{background:var(--accent-soft);border-color:var(--accent);}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(15,16,22,.42);display:none;
  align-items:center;justify-content:center;z-index:100;
}
.overlay.open{display:flex;}
.modal{
  background:var(--surface);border-radius:20px;padding:22px 24px;width:360px;max-width:92vw;
  box-shadow:var(--shadow);max-height:86vh;overflow:auto;
  animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:5px;}
.field input[type=text],.field input[type=date],.field select{
  width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink);font-size:13.5px;font-family:inherit;
}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
.palette{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;align-items:center;}
.swatchbtn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0;}
.swatchbtn.sel{border-color:var(--ink);}
.custom-color{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);padding:0;background:none;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.btn{border-radius:var(--radius-pill);padding:8px 16px;font-size:13px;font-weight:600;border:none;}
.btn-ghost{background:var(--surface-2);color:var(--ink);}
.btn-ghost:hover{background:var(--border);}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{opacity:.88;}
.btn-danger{background:var(--danger);color:#fff;}

/* Day detail */
.day-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.day-badge{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:700;color:#20222B;flex:0 0 auto;
}
.day-sub{font-size:12.5px;color:var(--ink-muted);}
.day-events{margin-bottom:14px;display:flex;flex-direction:column;gap:5px;}
.day-events .event-row .del{border:none;background:none;opacity:.4;font-size:12px;}
.day-events .event-row .del:hover{opacity:1;color:var(--danger);}
.day-add-form{border-top:1px solid var(--border);padding-top:12px;margin-top:6px;}

/* Context menu */
.ctxmenu{
  position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);z-index:200;display:none;overflow:hidden;min-width:140px;
}
.ctxmenu.open{display:block;}
.ctxmenu button{
  display:block;width:100%;text-align:left;padding:9px 14px;background:none;border:none;
  font-size:13px;color:var(--ink);font-weight:500;
}
.ctxmenu button:hover{background:var(--surface-2);}
.ctxmenu button:disabled{opacity:.4;cursor:default;}
.ctxmenu button:disabled:hover{background:none;}

/* Toast / favorite popup */
.fav-list-toast{display:flex;flex-direction:column;gap:6px;margin:10px 0 4px;}
.fav-list-toast div{font-size:13.5px;font-weight:600;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

@media (max-width:820px){
  .sidebar{display:none;}
  .year-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="wordmark"><span class="dot"></span>Organizador</div>
    <div class="view-dropdown">
      <button class="view-btn" id="viewBtn">Formato de vista ▾</button>
      <div class="view-menu" id="viewMenu">
        <button data-v="three" class="active">3 meses</button>
        <button data-v="year">Año completo</button>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="searchwrap">
      <span class="ico">⌕</span>
      <input type="text" id="searchInput" placeholder="Buscar evento…">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="iconbtn" id="themeBtn" title="Cambiar tema">◐</button>
  </div>

  <div class="main">
    <div class="cal-area">
      <div class="cal-nav">
        <button class="navbtn" id="prevBtn">‹</button>
        <button class="navbtn" id="nextBtn">›</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="today-btn" id="todayBtn">Hoy</button>
      </div>
      <div class="cal-body fade" id="calBody"></div>
    </div>

    <div class="sidebar">
      <div class="sb-section">
        <h2>Cosas para hacer</h2>
        <div id="collectionsList"></div>
        <button class="newcol-btn" id="newColBtn">+ Nueva colección</button>
      </div>
      <div class="sb-section" style="border-bottom:none;">
        <h2>Próximos favoritos</h2>
        <div id="favList"></div>
        <button class="export-btn" id="exportBtn" style="margin-top:12px;">⤓ Exportar a .ics</button>
        <button class="export-btn" id="backupBtn" style="margin-top:8px;">⤓ Respaldar datos (.json)</button>
        <button class="export-btn" id="restoreBtn" style="margin-top:8px;">⤒ Restaurar respaldo</button>
        <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="ctxmenu" id="ctxMenu"><button id="ctxUndo">↺ Deshacer</button></div>

<script>
/* ================= DATA ================= */
const PALETTE = ['#F5B0AE','#F7CBA2','#F6E39A','#B9E3A8','#A6DFD6','#A9CBEE','#C7B7EC','#F0B8DA'];
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const WD = ['L','M','M','J','V','S','D'];
const STORAGE_KEY = 'organizadorCalendarioData_v1';

function uid(){ return Math.random().toString(36).slice(2,9); }
function todayISO(){ const d=new Date(); return isoOf(d); }
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

let state = loadState();

function defaultState(){
  const now = new Date();
  return {
    theme:'light',
    view:'three',
    anchor: now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01',
    collections:{},
    events:{},
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return defaultState();
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ---- Undo ---- */
let undoStack = [];
function snapshot(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length>30) undoStack.shift();
}
function undo(){
  if(!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  saveState();
  renderAll();
}

/* ================= RENDER ================= */
function renderAll(){
  document.documentElement.setAttribute('data-theme', state.theme);
  renderTopControls();
  renderCalendar();
  renderCollections();
  renderFavorites();
}

function renderTopControls(){
  document.querySelectorAll('#viewMenu button').forEach(b=>{
    b.classList.toggle('active', b.dataset.v===state.view);
  });
}

function monthDaysGrid(y,m){
  const first = new Date(y,m,1);
  const startPad = (first.getDay()+6)%7; // Monday=0
  const totalDays = new Date(y,m+1,0).getDate();
  const cells = [];
  for(let i=0;i<startPad;i++) cells.push(null);
  for(let d=1; d<=totalDays; d++) cells.push(new Date(y,m,d));
  while(cells.length%7!==0) cells.push(null);
  return cells;
}

function eventsOn(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const result = [];
  const seen = new Set();
  Object.values(state.events).forEach(ev=>{
    if(ev.date===iso){ result.push(ev); seen.add(ev.id); return; }
    const col = state.collections[ev.collectionId];
    if(col && col.recurring && !seen.has(ev.id)){
      const [ey,em,ed] = ev.date.split('-').map(Number);
      if(em===m && ed===d){ result.push(ev); seen.add(ev.id); }
    }
  });
  return result;
}

function eventsForDots(iso){
  return eventsOn(iso).filter(ev=>{
    if(ev.hidden) return false;
    const col = state.collections[ev.collectionId];
    if(col && col.hideDots) return false;
    return true;
  });
}

function nextOccurrenceISO(ev){
  const col = state.collections[ev.collectionId];
  const today = parseISO(todayISO());
  let d = parseISO(ev.date);
  if(col && col.recurring){
    while(d < today){
      d = new Date(d.getFullYear()+1, d.getMonth(), d.getDate());
    }
  }
  return isoOf(d);
}

function buildMiniMonth(y,m,size){ // size: 'mini' | 'big'
  const wrap = document.createElement('div');
  wrap.className = size==='mini' ? 'mini-month' : 'big-month';
  const h3 = document.createElement('h3');
  h3.textContent = MONTHS[m][0].toUpperCase()+MONTHS[m].slice(1)+(size==='big' ? ' '+y : '');
  wrap.appendChild(h3);
  const grid = document.createElement('div');
  grid.className = size==='mini' ? 'mini-grid' : 'big-grid';
  WD.forEach(l=>{
    const el=document.createElement('div'); el.className='wd'; el.textContent=l; grid.appendChild(el);
  });
  const today = todayISO();
  monthDaysGrid(y,m).forEach(date=>{
    const cell = document.createElement('div');
    cell.className = (size==='mini'?'mini-cell':'big-cell');
    if(!date){ cell.classList.add('pad'); grid.appendChild(cell); return; }
    const iso = isoOf(date);
    cell.dataset.date = iso;
    if(iso===today) cell.classList.add('today');
    const num = document.createElement('span');
    num.className='daynum';
    num.textContent = date.getDate();
    cell.appendChild(num);
    const evs = eventsForDots(iso);
    if(evs.length){
      const dots = document.createElement('div'); dots.className='dots';
      evs.slice(0,6).forEach(ev=>{
        const dot=document.createElement('span'); dot.style.background=ev.color; dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderCalendar(){

function renderCollections(){

    head.innerHTML = `<span class="chev">▸</span><span class="swatch" style="background:${col.color}"></span><span class="cname"></span><button class="dots-toggle ${col.hideDots?'active':''}" title="Ocultar puntos de esta colección en el calendario">${col.hideDots?'🙈':'👁'}</button><button class="recur-toggle ${col.recurring?'active':''}" title="Repetir cada año">🔁</button><button class="del" title="Eliminar colección">✕</button>`;
    head.querySelector('.cname').textContent = col.name;
    head.addEventListener('click', (e)=>{
      if(e.target.closest('.del') || e.target.closest('.recur-toggle') || e.target.closest('.dots-toggle')) return;
      col.open = !col.open; saveState(); renderCollections();
    });
    head.querySelector('.dots-toggle').addEventListener('click',(e)=>{
      e.stopPropagation();
      snapshot();
      col.hideDots = !col.hideDots;
      saveState(); renderAll();
    });
    head.querySelector('.recur-toggle').addEventListener('click',(e)=>{
      e.stopPropagation();
      snapshot();
      col.recurring = !col.recurring;
      saveState(); renderAll();
    });
    head.querySelector('.del').addEventListener('click',(e)=>{
      e.stopPropagation();
      confirmModal(`¿Eliminar la colección "${col.name}" y todas sus fechas?`, ()=>{
        snapshot();
        Object.keys(state.events).forEach(id=>{ if(state.events[id].collectionId===col.id) delete state.events[id]; });
        delete state.collections[col.id];
        saveState(); renderAll();

    });
    wrap.appendChild(head);
    const body = document.createElement('div'); body.className='collection-body';
    const evs = Object.values(state.events).filter(e=>e.collectionId===col.id).sort((a,b)=>a.date.localeCompare(b.date));
    if(!evs.length){
      const e=document.createElement('div'); e.className='empty-note'; e.style.margin='2px 0 6px'; e.textContent='Sin fechas todavía.';
      body.appendChild(e);
    }
    let lastMonthKey = null;
    evs.forEach(ev=>{
      const d = parseISO(ev.date);
      const monthKey = d.getFullYear()+'-'+d.getMonth();
      if(monthKey !== lastMonthKey){
        const sep = document.createElement('div'); sep.className='month-sep';
        const label = MONTHS[d.getMonth()][0].toUpperCase()+MONTHS[d.getMonth()].slice(1)+' '+d.getFullYear();
        sep.innerHTML = `<span class="line"></span><span class="mlabel"></span><span class="line"></span>`;
        sep.querySelector('.mlabel').textContent = label;
        body.appendChild(sep);
        lastMonthKey = monthKey;
      }
      const row = document.createElement('div'); row.className='event-row';
      row.innerHTML = `<span class="edot" style="background:${ev.color}"></span><span class="etitle"></span><span class="edate"></span><button class="estar ${ev.favorite?'fav':''}">★</button><button class="ehide ${ev.hidden?'active':''}" title="Ocultar esta fecha en el calendario">${ev.hidden?'🙈':'👁'}</button><button class="edel" title="Eliminar fecha">✕</button>`;
      row.querySelector('.etitle').textContent = ev.title;
      row.querySelector('.edate').textContent = formatShort(ev.date);
      row.querySelector('.estar').addEventListener('click',()=>{
        snapshot(); ev.favorite=!ev.favorite; saveState(); renderAll();
      });
      row.querySelector('.ehide').addEventListener('click',()=>{
        snapshot(); ev.hidden=!ev.hidden; saveState(); renderAll();
      });
      row.querySelector('.edel').addEventListener('click',()=>{
        confirmModal(`¿Eliminar la fecha "${ev.title}"?`, ()=>{
          snapshot(); delete state.events[ev.id]; saveState(); renderAll();
        });
      });
      row.addEventListener('click',(e)=>{
        if(!e.target.closest('.estar') && !e.target.closest('.ehide') && !e.target.closest('.edel')) openDayModal(ev.date);
      });
      body.appendChild(row);
    });
    const addBtn = document.createElement('button'); addBtn.className='addlink'; addBtn.textContent='+ Añadir fecha';
    addBtn.addEventListener('click',()=>openAddEventModal({collectionId:col.id}));
    body.appendChild(addBtn);
    wrap.appendChild(body);
    list.appendChild(wrap);
  });

/* ================= DAY INTERACTION (click + drag chain) ================= */
let dragStart=null, dragging=false;

function attachDayHandlers(container){
  const cells = container.querySelectorAll('[data-date]');
  cells.forEach(cell=>{
    cell.addEventListener('mousedown', (e)=>{
      dragStart = cell.dataset.date; dragging=false;
      e.preventDefault();
    });
    cell.addEventListener('mouseenter', ()=>{
      if(dragStart===null) return;
      if(cell.dataset.date!==dragStart) dragging=true;
      highlightRange(container, dragStart, cell.dataset.date);
    });
  });
}
document.addEventListener('mouseup', onMouseUpOnce);
function onMouseUpOnce(){
  if(dragStart!==null){
    if(dragging){
      const range = [...document.querySelectorAll('.drag-range')].map(c=>c.dataset.date).sort();
      if(range.length>1) openChainModal(range[0], range[range.length-1]);
    } else {
      openDayModal(dragStart);
    }
  }
  document.querySelectorAll('.drag-range').forEach(c=>c.classList.remove('drag-range'));
  dragStart=null; dragging=false;
}
function highlightRange(container, startISO, endISO){
  container.querySelectorAll('[data-date]').forEach(c=>c.classList.remove('drag-range'));
  const all = [...container.querySelectorAll('[data-date]')];
  const s = Math.min(all.findIndex(c=>c.dataset.date===startISO), all.findIndex(c=>c.dataset.date===endISO));
  const e = Math.max(all.findIndex(c=>c.dataset.date===startISO), all.findIndex(c=>c.dataset.date===endISO));
  for(let i=s;i<=e;i++) all[i].classList.add('drag-range');
}

/* ================= EXPORT ICS ================= */
function exportICS(){
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Organizador Personal//ES'];
  Object.values(state.events).forEach(ev=>{
    const d = ev.date.replace(/-/g,'');
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+ev.id+'@organizador-personal');
    lines.push('DTSTART;VALUE=DATE:'+d);
    lines.push('SUMMARY:'+ev.title.replace(/\n/g,' '));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'calendario.ics';
  a.click();
}

/* ================= RESPALDO JSON (exportar / importar) ================= */
function exportBackup(){
  const date = todayISO();
  const payload = { app:'organizador-calendario', version:1, exportedAt:new Date().toISOString(), data:state };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo-calendario-'+date+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function isValidBackup(d){
  return d && typeof d==='object' && d.events && typeof d.events==='object' && !Array.isArray(d.events)
    && d.collections && typeof d.collections==='object' && !Array.isArray(d.collections);
}
function askRestore(data){
  const nEv = Object.keys(data.events).length;
  const nCol = Object.keys(data.collections).length;
  openModal(`
    <h3>Restaurar respaldo</h3>
    <p style="font-size:13.5px;line-height:1.5;margin:0 0 6px;">El archivo tiene <b>${nEv}</b> evento(s) y <b>${nCol}</b> colección(es).</p>
    <p style="font-size:13px;line-height:1.5;color:var(--danger);margin:0;">Esto reemplaza TODO lo que tienes ahora en este calendario.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="rsNo">Cancelar</button>
      <button class="btn btn-danger" id="rsYes">Restaurar</button>
    </div>
  `);
  document.getElementById('rsNo').onclick = closeModal;
  document.getElementById('rsYes').onclick = ()=>{
    snapshot();
    state = Object.assign(defaultState(), data);
    saveState();
    closeModal();
    renderAll();
  };
}
function showRestoreError(){
  openModal(`
    <h3>Archivo no válido</h3>
    <p style="font-size:13.5px;line-height:1.5;margin:0;">Ese archivo no se pudo leer como respaldo del calendario. Revisa que sea el .json que exportaste desde aquí.</p>
    <div class="modal-actions"><button class="btn btn-primary" id="rsOk">Entendido</button></div>
  `);

}

document.getElementById('restoreFile').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }catch(err){ showRestoreError(); return; }
    const data = parsed && parsed.data ? parsed.data : parsed;
    if(!isValidBackup(data)){ showRestoreError(); return; }
    askRestore(data);
  };
  reader.readAsText(f);
});

}

document.getElementById('newColBtn').addEventListener('click', openNewCollectionModal);
document.getElementById('exportBtn').addEventListener('click', exportICS);

/* ================= UNDO (Ctrl+Z + right-click) ================= */
document.addEventListener('keydown',(e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
  if(e.key==='Escape'){ closeModal(); document.getElementById('ctxMenu').classList.remove('open'); }
});
const ctxMenu = document.getElementById('ctxMenu');
document.addEventListener('contextmenu',(e)=>{
  e.preventDefault();
  ctxMenu.style.left = e.clientX+'px';
  ctxMenu.style.top = e.clientY+'px';
  document.getElementById('ctxUndo').disabled = undoStack.length===0;
  ctxMenu.classList.add('open');
});
document.getElementById('ctxUndo').addEventListener('click',()=>{ undo(); ctxMenu.classList.remove('open'); });
document.addEventListener('click',(e)=>{ if(!e.target.closest('.ctxmenu')) ctxMenu.classList.remove('open'); });

/* ================= INIT ================= */
function checkTodayFavorites(){
  const today = todayISO();
  const [ty,tm,td] = today.split('-').map(Number);
  const favs = Object.values(state.events).filter(e=>{
    if(!e.favorite) return false;
    if(e.date===today) return true;
    const col = state.collections[e.collectionId];
    if(col && col.recurring){
      const [ey,em,ed] = e.date.split('-').map(Number);
      return em===tm && ed===td;
    }
    return false;
  });
  if(favs.length){
    openModal(`
      <h3>★ Hoy es un día especial</h3>
      <div class="fav-list-toast">${favs.map(f=>`<div>${f.title}</div>`).join('')}</div>
      <div class="modal-actions"><button class="btn btn-primary" id="okFav">Entendido</button></div>
    `);
    document.getElementById('okFav').onclick = closeModal;
  }
}

renderAll();
checkTodayFavorites();
</script>
